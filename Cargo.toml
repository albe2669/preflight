[workspace]
resolver = "3"
members = [
    "crates/migration",
    "crates/graphql",
    "crates/server",
    "crates/tui",
    "crates/todo",
    "crates/github",
    "crates/linear",
    "crates/links",
    "crates/remote-sync",
    "crates/sync-state",
]

[workspace.package]
edition = "2024"
rust-version = "1.85.0"
version = "0.1.0"
publish = false

[workspace.dependencies]
# Workspace-internal crates.
migration = { path = "crates/migration" }
graphql = { path = "crates/graphql" }
todo-domain = { path = "crates/todo" }
github = { path = "crates/github" }
linear = { path = "crates/linear" }
links = { path = "crates/links" }
remote-sync = { path = "crates/remote-sync" }
sync-state = { path = "crates/sync-state" }

seaography = { version = "~2.0.0-rc.9", features = [
    "graphql-playground",
    "with-decimal",
    "with-chrono",
    "macros",
    "strict-custom-types",
] }
sea-orm = { version = "~2.0.0-rc.40", features = [
    "sqlx-sqlite",
    "runtime-tokio-native-tls",
    "seaography",
    "with-chrono",
] }
sea-orm-migration = { version = "~2.0.0-rc.40", features = [
    "sqlx-sqlite",
    "runtime-tokio-native-tls",
] }

# Async GraphQL + web.
async-graphql = "7"
async-graphql-axum = "7"
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Serde + time + config.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
toml = "0.9"

# Errors + utils.
thiserror = "2"
async-trait = "0.1"
anyhow = "1"
# Async utilities for the TUI.
futures-util = "0.3"

# HTTP clients for sync.
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "json",
] }
