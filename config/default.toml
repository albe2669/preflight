# Application configuration for the todo planner.
#
# The database path, timezone, and day-start hour live here — not in the
# database — because they are application configuration, not data. The server
# loads this file (or one named by the CONFIG env var) at startup.

[database]
# Relative paths resolve against the project root. `mode=rwc` creates the file
# if missing; the sqlx pool builder sets pragmas (FK on, WAL, busy_timeout).
path = "db.sqlite"

[clock]
# IANA timezone. The logical day is computed in this zone.
timezone = "America/Los_Angeles"
# A logical day starts at this hour (0-23), local time. 4 means 04:00: a todo
# you touch at 02:00 counts as *yesterday*, which keeps late-night work off the
# morning plan. Stored as i64 to match Clock::day_start_hour.
day_start_hour = 4

[logging]
level = "info"
directory = "logs"

[sync]
# GitHub. Leave the token unset in development; the sync crate treats absence
# as a no-op. Filters are structured rules — see [[sync.github.filters]] below.
# Either set `github_token` inline, or point `github_token_path` at a secrets
# file (sops-nix style) whose trimmed contents are the token. The path wins
# when both are set.
github_token = ""
github_token_path = ""

# Linear. The token is a personal API key. Either set `linear_token` inline,
# or point `linear_token_path` at a secrets file. The path wins when both are
# set. Filters are structured rules — see [[sync.linear.filters]] below.
linear_token = ""
linear_token_path = ""

[sync.github]
# When true, draft PRs are excluded unless authored by the authenticated user.
exclude_drafts_unless_authored_by_me = true
# Each rule matches a PR by repo, author, reviewer, reviewing_team, and/or
# draft-exclusion keys.  Rules are OR-ed; conditions within a rule are AND-ed.
# Per-rule draft keys (each defaults to false):
#   exclude_others_drafts — exclude drafts NOT authored by me (keep my drafts)
#   exclude_my_drafts     — exclude drafts authored by me (keep others' drafts)
#   Both true excludes ALL drafts for that rule.
# `author` / `reviewer` use "@me" for the authenticated user (bare "me" is rejected).
# Examples:
#   { author = "@me" }
#   { repo = "api-specs", reviewing_team = "ai-agents", exclude_others_drafts = true }
#   { repo = "agent-api", exclude_others_drafts = true }
#   { repo = "agent-api", exclude_my_drafts = true }
#   { repo = "albe2669/" }
filters = []

[sync.linear]
# Each rule matches an issue by team, assignee, creator, and/or project_lead.
# author/assignee/creator/project_lead accept "me" or a name. Examples:
#   { creator = "me" }
#   { assignee = "me" }
#   { team = "ENG", assignee = "me" }
#   { project_lead = "me" }
filters = []

[server]
host = "127.0.0.1"
port = 8000
# Optional GraphQL limits.
# depth_limit = 12
# complexity_limit = 1000
