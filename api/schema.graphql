  todoPullRequest(filters: TodoPullRequestFilterInput, having: TodoPullRequestHavingInput, orderBy: TodoPullRequestOrderInput, pagination: PaginationInput): TodoPullRequestConnection!
  linearIssue(filters: LinearIssueFilterInput, having: LinearIssueHavingInput, orderBy: LinearIssueOrderInput, pagination: PaginationInput): LinearIssueConnection!
  todoLinearIssue(filters: TodoLinearIssueFilterInput, having: TodoLinearIssueHavingInput, orderBy: TodoLinearIssueOrderInput, pagination: PaginationInput): TodoLinearIssueConnection!
  syncState(filters: SyncStateFilterInput, having: SyncStateHavingInput, orderBy: SyncStateOrderInput, pagination: PaginationInput): SyncStateConnection!
  dailyReview(date: String!): DailyReview!
  clock: Clock!
  _sea_orm_entity_metadata(table_name: String!): Table!
}

